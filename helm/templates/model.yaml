apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace:  {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
    spec:
      # Optional: force ARM64 scheduling (good safety on mixed clusters)
      nodeSelector:
        kubernetes.io/arch: arm64

      # If pulling from nvcr.io and you need a secret:
      # imagePullSecrets:
      #   - name: ngc-registry

      containers:
        - name: model-service
          image: {{ .Values.image_model.repository }}:{{ .Values.image_model.tag | default "latest" }}
          ports:
            - containerPort: 8000

          # Prefer letting the image CMD run. If you must override, use python not a host-built venv:
          # command: ["python", "-m", "your_model_package.server"]

          resources:
            requests:
              memory: "2Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: "3Gi"
              cpu: "3"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: model-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
